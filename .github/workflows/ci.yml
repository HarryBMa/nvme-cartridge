name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The logic that can be checked anywhere. cartridge-core has no UI dependency
  # on purpose, so this needs no webkit, no display and no Windows.
  core:
    name: core logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --manifest-path core/Cargo.toml --check
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets
      - run: cargo test --manifest-path core/Cargo.toml

  # The watcher is Windows-only in behaviour but must keep compiling on Linux,
  # where it builds a stub that tells you to install the udev rule instead.
  watcher:
    name: watcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: watcher
      - run: cargo fmt --manifest-path watcher/Cargo.toml --check
      - run: cargo test --manifest-path watcher/Cargo.toml
      - run: cargo build --manifest-path watcher/Cargo.toml --release

  # The Tauri binary. Only checked, not bundled: this is the part that needs
  # webkit2gtk, and a check catches the type errors that matter.
  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install webkit2gtk
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
                                  librsvg2-dev libssl-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-ui/src-tauri
      - run: cargo check --manifest-path tauri-ui/src-tauri/Cargo.toml --all-targets

  # The frontend ships unbundled, so a syntax error would only show up at
  # runtime in the webview. This is the cheapest way to catch one.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the JavaScript parses
        run: |
          for file in tauri-ui/app/src/*.js tools/*.mjs; do
            echo "checking $file"
            node --check "$file"
          done
      - name: Check every element the scripts reach for exists
        run: node tools/check-dom-ids.mjs

  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: for f in ./*.sh linux/*.sh; do bash -n "$f"; done
      # error-level only for now: the installer scripts predate this workflow and
      # have not been through shellcheck yet. Tighten to --severity=warning once
      # they have.
      - name: shellcheck
        run: shellcheck --severity=error ./*.sh linux/*.sh

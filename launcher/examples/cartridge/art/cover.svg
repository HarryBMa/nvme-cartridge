<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200">
  <title>Cinder &amp; Salt — key art</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1930"/>
      <stop offset="0.28" stop-color="#4a2a3c"/>
      <stop offset="0.52" stop-color="#a3502f"/>
      <stop offset="0.66" stop-color="#dc8b34"/>
      <stop offset="0.735" stop-color="#f2c261"/>
    </linearGradient>

    <linearGradient id="flat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b45c"/>
      <stop offset="0.35" stop-color="#a56338"/>
      <stop offset="1" stop-color="#3b2431"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdf9a" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#f0a341" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f0a341" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c2b"/>
      <stop offset="1" stop-color="#150f1c"/>
    </linearGradient>

    <!-- Film grain: keeps the flat vector gradients from looking synthetic. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="900" height="1200" fill="url(#sky)"/>

  <!-- Sun glow, then the disc sitting on the horizon at 880 -->
  <ellipse cx="470" cy="880" rx="470" ry="300" fill="url(#glow)"/>
  <circle cx="470" cy="880" r="132" fill="#ffe3a4"/>
  <circle cx="470" cy="880" r="132" fill="#fff3d2" opacity="0.5"/>

  <!-- Thin cloud bars, stacked tighter towards the horizon -->
  <g fill="#2b1c2e" opacity="0.5">
    <rect x="90" y="470" width="330" height="7" rx="3.5"/>
    <rect x="520" y="512" width="250" height="6" rx="3"/>
    <rect x="180" y="560" width="470" height="9" rx="4.5"/>
    <rect x="60" y="628" width="200" height="6" rx="3"/>
    <rect x="600" y="640" width="240" height="7" rx="3.5"/>
    <rect x="240" y="700" width="420" height="8" rx="4"/>
    <rect x="120" y="760" width="300" height="6" rx="3"/>
    <rect x="540" y="792" width="290" height="7" rx="3.5"/>
    <rect x="300" y="836" width="380" height="6" rx="3"/>
  </g>

  <!-- Salt flat -->
  <rect x="0" y="880" width="900" height="320" fill="url(#flat)"/>
  <!-- A hard line at the horizon so the flat reads as ground, not more sky -->
  <rect x="0" y="878" width="900" height="3" fill="#8f5330" opacity="0.55"/>

  <!-- Reflection of the sun, broken into bands that widen as they near us -->
  <g fill="#ffe9bd">
    <rect x="424" y="892" width="92" height="6" opacity="0.5"/>
    <rect x="404" y="910" width="132" height="5" opacity="0.42"/>
    <rect x="432" y="932" width="76" height="5" opacity="0.34"/>
    <rect x="392" y="956" width="156" height="4" opacity="0.26"/>
    <rect x="440" y="984" width="64" height="4" opacity="0.2"/>
    <rect x="398" y="1014" width="148" height="3" opacity="0.14"/>
  </g>

  <!-- Cracked-earth polygons on the flat, fading with distance -->
  <g stroke="#33202c" fill="none" stroke-width="2" opacity="0.45">
    <path d="M0 1000 L180 986 L360 1010 L560 990 L760 1014 L900 998"/>
    <path d="M0 1064 L150 1044 L330 1074 L520 1048 L720 1080 L900 1056"/>
    <path d="M0 1140 L200 1112 L420 1148 L640 1116 L900 1150"/>
    <path d="M180 986 L150 1044 M360 1010 L330 1074 M560 990 L520 1048 M760 1014 L720 1080"/>
    <path d="M150 1044 L200 1112 M330 1074 L420 1148 M520 1048 L640 1116"/>
  </g>

  <!-- Foreground ridge -->
  <path d="M0 1200 L0 1092 C 120 1074, 210 1108, 320 1096 C 430 1084, 520 1112, 640 1100 C 760 1088, 840 1110, 900 1098 L900 1200 Z" fill="url(#ridge)"/>

  <!-- Lone figure on the ridge crest, read as a silhouette against the flat -->
  <g fill="#0f0b16" transform="translate(448 1000) scale(1.55)">
    <circle cx="10" cy="8" r="8.5"/>
    <!-- torso, tapering into a long coat -->
    <path d="M1.5 18 L18.5 18 L22 44 L19 60 L1 60 L-2 44 Z"/>
    <!-- arms hanging, slightly away from the body -->
    <path d="M-1.5 24 L-8.5 45 L-4 46.5 L2.5 27 Z"/>
    <path d="M21.5 24 L28.5 43 L24 44.5 L17.5 27 Z"/>
    <!-- legs -->
    <rect x="3" y="58" width="5.5" height="4.5"/>
    <rect x="11.5" y="58" width="5.5" height="4.5"/>
  </g>

  <!-- Grain, multiplied over everything at low opacity -->
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.13" style="mix-blend-mode:overlay"/>

  <!-- Vignette -->
  <rect width="900" height="1200" fill="none"/>
  <path d="M0 0 H900 V1200 H0 Z" fill="url(#glow)" opacity="0"/>
</svg>

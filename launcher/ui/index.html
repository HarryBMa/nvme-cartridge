<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cartridge Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The chassis is the whole visible surface: the window itself is
         transparent and undecorated. -->
    <main class="chassis" id="chassis" aria-labelledby="title">
      <span class="crop crop--tl" aria-hidden="true"></span>
      <span class="crop crop--bl" aria-hidden="true"></span>

      <!-- Artwork, bled to the window edges at the exact 3:4 of a cover. -->
      <div class="bay" data-tauri-drag-region>
        <img class="bay__img" id="art-img" alt="" />
        <div class="bay__fallback" id="art-fallback" aria-hidden="true">
          <span>NO&nbsp;ART</span>
        </div>
        <span class="bay__seam" aria-hidden="true"></span>
        <span class="bay__scan" aria-hidden="true"></span>
      </div>

      <!-- Face: the game, and the only two things to do with it. -->
      <section class="face" data-tauri-drag-region>
        <div class="face__wash" aria-hidden="true"></div>

        <header class="face__head">
          <p class="eyebrow">
            <span class="pip" aria-hidden="true"></span>
            <span id="eyebrow-text">Cartridge detected</span>
          </p>
          <div class="chrome">
            <button
              class="chrome__btn"
              id="details-toggle"
              type="button"
              aria-expanded="false"
              aria-controls="sheet"
            >
              Details
            </button>
            <button
              class="chrome__btn chrome__btn--icon"
              id="dismiss"
              type="button"
              aria-label="Dismiss (Esc)"
              title="Dismiss — Esc"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M4 4l8 8M12 4l-8 8" />
              </svg>
            </button>
          </div>
        </header>

        <div class="face__body">
          <h1 class="title" id="title"></h1>
          <p class="studio" id="studio"></p>
        </div>

        <!-- Only rendered when something is stopping Play from working. -->
        <div class="notice" id="notice" hidden></div>

        <footer class="actions">
          <button class="btn btn--play" id="play" type="button">
            <span class="btn__label">Play</span>
            <kbd class="btn__key" aria-hidden="true">&crarr;</kbd>
          </button>
          <button class="btn btn--eject" id="eject" type="button">
            <span class="btn__label">Eject</span>
            <kbd class="btn__key" aria-hidden="true">E</kbd>
          </button>
        </footer>
      </section>

      <!-- Everything the machine knows, on request only. -->
      <aside class="sheet" id="sheet" hidden aria-label="Cartridge details">
        <header class="sheet__head">
          <h2 class="sheet__title">Cartridge</h2>
          <button
            class="chrome__btn chrome__btn--icon"
            id="sheet-close"
            type="button"
            aria-label="Close details"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
        </header>
        <dl class="specs" id="specs"></dl>
        <div class="trust" id="trust"></div>
      </aside>

      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>

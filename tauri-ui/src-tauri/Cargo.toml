[package]
name = "pc-gamepak"
version = "0.1.0"
edition = "2021"
description = "Popup launcher for the PC GamePak"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gamepak-core = { path = "../../core" }
# No "protocol-asset": the cover is handed to the webview as a data URI, so the
# asset protocol stays switched off (see tauri.conf.json).
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    # CreateFileW takes a *const SECURITY_ATTRIBUTES, so it is gated behind
    # this even though the eject path passes null.
    "Win32_Security",
] }

# The launcher is started on insert and exits when it is dismissed, so start-up
# time and binary size matter more than peak throughput.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC GamePak</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <!-- The whole window is the cover art. Everything else sits on top of it. -->
  <main id="card" aria-labelledby="game-title">

    <img id="cover-img" alt="" />
    <div id="cover-placeholder" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"
           stroke-linecap="round" stroke-linejoin="round" width="52" height="52">
        <rect x="3" y="4" width="18" height="16" rx="2" />
        <path d="M3 15l5-4 4 3 3-2 6 4" />
        <circle cx="9" cy="9" r="1.4" />
      </svg>
      <p>No cover art</p>
    </div>

    <!-- Scrims: one under the top chrome, one under the title block. -->
    <div id="scrim-top" aria-hidden="true"></div>
    <div id="scrim-bottom" aria-hidden="true"></div>
    <div id="read-line" aria-hidden="true"></div>

    <!-- Top chrome -->
    <header id="chrome" data-tauri-drag-region>
      <p id="eyebrow" data-tauri-drag-region>
        <span id="pip" aria-hidden="true"></span>
        <span id="eyebrow-text">Cartridge</span>
      </p>
      <div id="chrome-actions">
        <button id="btn-details" class="icon-btn" type="button"
                aria-expanded="false" aria-controls="sheet"
                aria-label="Cartridge details" title="Details">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <circle cx="12" cy="12" r="3.1" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.11a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1z" />
          </svg>
        </button>
        <button id="btn-close" class="icon-btn" type="button"
                aria-label="Dismiss" title="Dismiss — Esc">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" width="16" height="16">
            <path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" />
          </svg>
        </button>
      </div>
    </header>

    <!-- The game, and the only two things to do with it -->
    <footer id="stage">
      <h1 id="game-title">Reading cartridge…</h1>

      <p id="notice" hidden></p>

      <!-- Single-game mode: one Play button -->
      <div id="button-row">
        <button id="btn-play" class="btn btn--play" type="button" disabled>
          <span class="btn__label">Play</span>
          <kbd class="btn__key" aria-hidden="true">&crarr;</kbd>
        </button>
        <button id="btn-eject" class="btn btn--eject" type="button" disabled>
          <span class="btn__label">Eject</span>
          <kbd class="btn__key" aria-hidden="true">E</kbd>
        </button>
      </div>

      <!-- Bundle mode: per-game list + shared Eject -->
      <ul id="game-list" hidden aria-label="Games on this cartridge"></ul>
      <div id="bundle-eject-row" hidden>
        <button id="btn-bundle-eject" class="btn btn--eject" type="button" disabled>
          <span class="btn__label">Eject</span>
          <kbd class="btn__key" aria-hidden="true">E</kbd>
        </button>
      </div>
    </footer>

    <!-- Details, on request only -->
    <aside id="sheet" hidden aria-label="Cartridge details">
      <header id="sheet-head">
        <h2>Cartridge</h2>
        <button id="btn-sheet-close" class="icon-btn" type="button" aria-label="Close details">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" width="16" height="16">
            <path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" />
          </svg>
        </button>
      </header>
      <div id="sheet-body">
        <dl id="specs"></dl>
        <div id="health" hidden></div>
      </div>
    </aside>

    <p id="toast" role="status" aria-live="polite"></p>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
